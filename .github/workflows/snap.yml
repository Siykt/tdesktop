name: Snap.

on:
  workflow_dispatch:
  push:
    # Pushes to the canary branches run only canary.yml, see there.
    branches-ignore:
      - public-canary
      - private-canary
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/snap.yml'
      - 'Telegram/build/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/snap.yml'
      - 'Telegram/build/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'

jobs:

  snap:
    name: Ubuntu
    runs-on: ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/nightly') && 'depot-ubuntu-latest-16' || 'ubuntu-latest' }}

    env:
      UPLOAD_ARTIFACT: "true"

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: First set up.
        run: |
          sudo iptables -P FORWARD ACCEPT
          sudo snap install --classic snapcraft
          sudo usermod -aG lxd $USER
          sudo lxd init --auto
          sudo lxd waitready

      - name: Free up some disk space.
        uses: samueldr/more-space-action@97048bd0df83fb05b5257887bdbaffc848887673
        with:
          enable-remove-default-apt-patterns: false
          enable-lvm-span: true
          lvm-span-mountpoint: /var/snap/lxd/common/lxd/storage-pools/default/containers

      - name: Apply API credentials.
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          set -e
          test -n "$API_ID"
          test -n "$API_HASH"
          sed -i "s/- -DTDESKTOP_API_ID=611335/- -DTDESKTOP_API_ID=$API_ID/" snap/snapcraft.yaml
          sed -i "s/d524b414d21f4d37f08684c1df41ac9c/$API_HASH/" snap/snapcraft.yaml
          grep -q "TDESKTOP_API_ID=$API_ID" snap/snapcraft.yaml
          grep -q "$API_HASH" snap/snapcraft.yaml
          echo "Credentials injected into snapcraft.yaml."

      - name: Telegram Desktop snap build.
        run: sudo -u $USER snap run snapcraft --verbosity=debug

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          artifact_name=$(echo telegram-desktop_*.snap)
          echo "ARTIFACT_NAME=$artifact_name" >> $GITHUB_ENV

          mkdir artifact
          mv $artifact_name artifact

      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact
          retention-days: 1
