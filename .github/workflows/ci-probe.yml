name: CI Probe

on:
  workflow_dispatch:
  push:
    branches:
      - account-limit-10000

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "CI is working on this fork"
          uname -a
          echo "ref=$GITHUB_REF sha=$GITHUB_SHA"
