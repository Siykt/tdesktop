name: Disk report.

on:
  workflow_dispatch:

jobs:

  report:
    name: Report
    runs-on: windows-latest

    steps:
      - name: Report.
        shell: pwsh
        run: |
          Get-PSDrive C,D | Select-Object Name,
            @{n='UsedGB';e={[math]::Round($_.Used / 1GB, 1)}},
            @{n='FreeGB';e={[math]::Round($_.Free / 1GB, 1)}} | Format-Table

          $roots = @(
            'C:\hostedtoolcache',
            'C:\hostedtoolcache\windows',
            'C:\Program Files\Android',
            'C:\Program Files\LLVM',
            'C:\Program Files\dotnet',
            'C:\Program Files\Microsoft Visual Studio',
            'C:\Program Files (x86)\Microsoft Visual Studio',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files\MySQL',
            'C:\Program Files\MongoDB',
            'C:\Program Files\R',
            'C:\tools',
            'C:\ProgramData',
            'C:\Users\runneradmin\AppData\Local\Android',
            'C:\Users\runneradmin\.dotnet',
            'C:\Users\runneradmin\.cargo',
            'C:\Users\runneradmin\.rustup',
            'C:\Windows\Installer',
            'C:\Windows\SoftwareDistribution'
          )
          foreach ($r in $roots) {
            if (Test-Path $r) {
              $s = (Get-ChildItem $r -Recurse -File -Force -ErrorAction SilentlyContinue |
                Measure-Object Length -Sum).Sum
              '{0,-58} {1,9:N1} GB' -f $r, ($s / 1GB)
            } else {
              '{0,-58} {1,9}' -f $r, 'missing'
            }
          }

          '--- C: top level ---'
          Get-ChildItem 'C:\' -Directory -Force -ErrorAction SilentlyContinue | ForEach-Object {
            $s = (Get-ChildItem $_.FullName -Recurse -File -Force -ErrorAction SilentlyContinue |
              Measure-Object Length -Sum).Sum
            '{0,-58} {1,9:N1} GB' -f $_.FullName, ($s / 1GB)
          }

          '--- hostedtoolcache\windows ---'
          Get-ChildItem 'C:\hostedtoolcache\windows' -Directory -Force -ErrorAction SilentlyContinue | ForEach-Object {
            $s = (Get-ChildItem $_.FullName -Recurse -File -Force -ErrorAction SilentlyContinue |
              Measure-Object Length -Sum).Sum
            '{0,-58} {1,9:N1} GB' -f $_.Name, ($s / 1GB)
          }
